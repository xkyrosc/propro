name: Build ProPrompt APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ProPrompt-Android-Project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q ProPrompt-Android-Project.zip
          cd ProPrompt
          npm install

      - name: Create Android project
        working-directory: ProPrompt
        run: npx cap add android

      - name: Build web app
        working-directory: ProPrompt
        run: npm run android:sync

      - name: Build APK
        working-directory: ProPrompt/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProPrompt-APK
          path: ProPrompt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
